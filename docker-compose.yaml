services:
  db:
    image: postgres:16-alpine
    container_name: metrica-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_DATABASE}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт наружу НЕ открываем: только на localhost, чтобы можно было
    # подключиться pgAdmin'ом через SSH-туннель.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    container_name: metrica-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Загруженные файлы живут на хосте, переживают пересборку контейнера
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    # Наружу порт не публикуем — доступ только через nginx на хосте
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
