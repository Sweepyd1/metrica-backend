# /etc/nginx/sites-available/metrica.conf
#
# Фронт и API живут на ОДНОМ домене — это принципиально:
# в бэкенде авторизация работает через httpOnly-куки, и CORS настроен
# только под явно перечисленные origin'ы. Схема "фронт на одном домене,
# API на другом" потребует доработки APP_CORS_ORIGINS и cookie_domain.

server {
    listen 80;
    # Раскомментируй, только если на сервере включён IPv6.
    # listen [::]:80;

    # Пока нет домена — оставь "_" (ловит любой Host, работает по IP).
    # Когда домен заработает — заменить на:
    # server_name metrica-platform.ru www.metrica-platform.ru;
    server_name _;

    root /var/www/metrica;
    index index.html;

    # Домашки в pdf/docx/pptx бывают тяжёлыми
    client_max_body_size 50m;

    access_log /var/log/nginx/metrica.access.log;
    error_log  /var/log/nginx/metrica.error.log;

    # ───── API ─────
    # Фронт ходит на /api/... , бэкенд слушает без префикса.
    # Слеш в конце proxy_pass срезает /api.
    # ^~ обязателен, иначе location для статики перехватит /api/*.js
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ───── Статика Vite ─────
    # Файлы в /assets/ имеют хэш в имени, кэшируем навсегда
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ───── SPA ─────
    # react-router обрабатывает маршруты на клиенте,
    # поэтому всё неизвестное отдаём на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html кэшировать нельзя, иначе после деплоя
    # у пользователей останется старая версия
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/woff2;
}
